[tool.uv.workspace]
members = ["apps/server", "apps/ai-worker", "packages/core-py"]

[tool.uv.sources]
manabi-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
