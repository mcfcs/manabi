[project]
name = "manabi-core"
version = "0.1.0"
description = "Shared models, schemas, and validators for Manabi"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pgvector>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manabi_core"]
