[project]
name = "manabi-server"
version = "0.1.0"
description = "Manabi app server — FastAPI backend + CPU-queue worker"
requires-python = ">=3.12"
dependencies = [
    "manabi-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.7",
    "procrastinate>=3.9",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manabi_server"]
