[project]
name = "manabi-ai-worker"
version = "0.1.0"
description = "Manabi GPU worker — runs on phillmyeol, pulls gpu-queue jobs from Postgres"
requires-python = ">=3.12"
dependencies = [
    "manabi-core",
    "procrastinate>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manabi_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
